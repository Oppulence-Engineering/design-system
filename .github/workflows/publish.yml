name: Publish to NPM

on:
  push:
    branches:
      - main
    paths:
      - "packages/design-system/**"
      - "packages/auth/**"
      - "packages/infinite-canvas/**"
      - "packages/core/**"
      - "packages/desktop-client/**"
      - "packages/e-invoicing/**"
      - "packages/events/**"
      - "packages/import/**"
      - "packages/integrations/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "design-system"
        type: choice
        options:
          - design-system
          - auth
          - infinite-canvas
          - core
          - desktop-client
          - e-invoicing
          - events
          - import
          - integrations
          - extracted
          - both
          - all
      version:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  detect-changes:
    name: Detect package changes
    runs-on: ubuntu-latest
    outputs:
      design-system: ${{ steps.filter.outputs.design-system }}
      auth: ${{ steps.filter.outputs.auth }}
      infinite-canvas: ${{ steps.filter.outputs.infinite-canvas }}
      core: ${{ steps.filter.outputs.core }}
      desktop_client: ${{ steps.filter.outputs.desktop_client }}
      e_invoicing: ${{ steps.filter.outputs.e_invoicing }}
      events: ${{ steps.filter.outputs.events }}
      import: ${{ steps.filter.outputs.import }}
      integrations: ${{ steps.filter.outputs.integrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            design-system:
              - 'packages/design-system/**'
            auth:
              - 'packages/auth/**'
            infinite-canvas:
              - 'packages/infinite-canvas/**'
            core:
              - 'packages/core/**'
            desktop_client:
              - 'packages/desktop-client/**'
            e_invoicing:
              - 'packages/e-invoicing/**'
            events:
              - 'packages/events/**'
            import:
              - 'packages/import/**'
            integrations:
              - 'packages/integrations/**'

  publish-design-system:
    name: Publish @oppulence/design-system
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      github.event_name == 'release' ||
      github.event.inputs.package == 'design-system' ||
      github.event.inputs.package == 'both' ||
      github.event.inputs.package == 'all' ||
      (github.event_name == 'push' && needs.detect-changes.outputs.design-system == 'true')
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Bump version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version || 'patch' }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          # Get latest version from npm, default to 0.0.0 if not published
          NPM=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          # Use the higher of local or npm version as base
          BASE=$(npx --yes semver "$LOCAL" "$NPM" | tail -1)
          NEW=$(npx --yes semver -i "$VERSION_BUMP" "$BASE")
          npm pkg set version="$NEW"
          echo "Local: $LOCAL, NPM: $NPM, Base: $BASE → New: $NEW"
          echo "NEW_VERSION=$NEW" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Resolve workspace dependencies for the published tarball
        working-directory: .
        run: |
          cp packages/design-system/package.json /tmp/design-system.package.json
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            // Truth comes from each sibling package.json, not from bun.lock,
            // which records workspace versions and had drifted three releases
            // behind when this was written.
            const versions = new Map(
              fs.readdirSync("packages", { withFileTypes: true })
                .filter((entry) => entry.isDirectory())
                .map((entry) => path.join("packages", entry.name, "package.json"))
                .filter((file) => fs.existsSync(file))
                .map((file) => JSON.parse(fs.readFileSync(file, "utf8")))
                .map((pkg) => [pkg.name, pkg.version]),
            );
            const target = "packages/design-system/package.json";
            const pkg = JSON.parse(fs.readFileSync(target, "utf8"));
            let resolved = 0;
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[field] ?? {})) {
                if (!String(spec).startsWith("workspace:")) continue;
                const version = versions.get(name);
                if (!version) throw new Error(`no workspace package provides ${name}`);
                pkg[field][name] = `^${version}`;
                resolved += 1;
                console.log(`${field}.${name}: ${spec} -> ^${version}`);
              }
            }
            fs.writeFileSync(target, `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`resolved ${resolved} workspace specifier(s)`);
          '

      - name: Fail if any workspace specifier would ship
        run: |
          # npm does not rewrite the workspace: protocol on publish, so a
          # specifier that survives to here produces a tarball npm cannot
          # install: EUNSUPPORTEDPROTOCOL for every consumer. @oppulence/
          # design-system@1.2.3 shipped that way and was uninstallable, and it
          # took @oppulence/auth with it through its peer dependency.
          # Only the fields a consumer installs are checked. devDependencies
          # ship in the manifest but are never installed by a consumer, and
          # some of them name private workspace packages that have no version
          # on npm to point at.
          node -e '
            const pkg = require("./package.json");
            const bad = [];
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[field] ?? {})) {
                if (String(spec).startsWith("workspace:")) bad.push(`${field}.${name} = ${spec}`);
              }
            }
            if (bad.length) {
              console.log(`::error::a workspace: specifier survived into the published manifest: ${bad.join(", ")}`);
              process.exit(1);
            }
            console.log("No workspace: specifiers remain in installable fields.");
          '

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Restore the workspace specifiers
        if: always()
        working-directory: .
        run: |
          # Only the dependency fields are put back. The version bump above
          # must survive, because the commit step below pushes it.
          node -e '
            const fs = require("node:fs");
            const target = "packages/design-system/package.json";
            const current = JSON.parse(fs.readFileSync(target, "utf8"));
            const original = JSON.parse(fs.readFileSync("/tmp/design-system.package.json", "utf8"));
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              if (original[field]) current[field] = original[field];
            }
            fs.writeFileSync(target, `${JSON.stringify(current, null, 2)}\n`);
            console.log("workspace specifiers restored; version kept at", current.version);
          '

      - name: Commit version bump
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add packages/design-system/package.json
          VERSION=$(node -p "require('./packages/design-system/package.json').version")
          git commit -m "chore: bump @oppulence/design-system to v${VERSION}" || echo "No changes to commit"
          git push || echo "Nothing to push"

  publish-auth:
    name: Publish @oppulence/auth
    runs-on: ubuntu-latest
    needs: [detect-changes, publish-design-system]
    if: |
      always() &&
      (needs.publish-design-system.result == 'success' || needs.publish-design-system.result == 'skipped') &&
      (
        github.event.inputs.package == 'auth' ||
        github.event.inputs.package == 'both' ||
        github.event.inputs.package == 'all' ||
        (github.event_name == 'push' && needs.detect-changes.outputs.auth == 'true')
      )
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/auth
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Bump version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version || 'patch' }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          # Get latest version from npm, default to 0.0.0 if not published
          NPM=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          # Use the higher of local or npm version as base
          BASE=$(npx --yes semver "$LOCAL" "$NPM" | tail -1)
          NEW=$(npx --yes semver -i "$VERSION_BUMP" "$BASE")
          npm pkg set version="$NEW"
          echo "Local: $LOCAL, NPM: $NPM, Base: $BASE → New: $NEW"
          echo "NEW_VERSION=$NEW" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps chromium
        working-directory: .

      - name: Run tests before publish
        run: bun run test
        working-directory: .

      - name: Typecheck
        run: bun run typecheck

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add packages/auth/package.json
          VERSION=$(node -p "require('./packages/auth/package.json').version")
          git commit -m "chore: bump @oppulence/auth to v${VERSION}" || echo "No changes to commit"
          git push || echo "Nothing to push"

  publish-infinite-canvas:
    name: Publish @oppulence/infinite-canvas
    runs-on: ubuntu-latest
    # Serialize after the other publish jobs so the bot version-bump commits do not race
    # on `git push` (the loser's push is silently swallowed, drifting package.json).
    needs: [detect-changes, publish-design-system, publish-auth]
    if: |
      always() &&
      (needs.publish-design-system.result == 'success' || needs.publish-design-system.result == 'skipped') &&
      (needs.publish-auth.result == 'success' || needs.publish-auth.result == 'skipped') &&
      (
        github.event.inputs.package == 'infinite-canvas' ||
        github.event.inputs.package == 'all' ||
        (github.event_name == 'push' && needs.detect-changes.outputs.infinite-canvas == 'true')
      )
    permissions:
      contents: write
      id-token: write # npm provenance (OIDC trusted publishing)
    defaults:
      run:
        working-directory: packages/infinite-canvas
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Bump version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version || 'patch' }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          NPM=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          BASE=$(npx --yes semver "$LOCAL" "$NPM" | tail -1)
          NEW=$(npx --yes semver -i "$VERSION_BUMP" "$BASE")
          npm pkg set version="$NEW"
          echo "Local: $LOCAL, NPM: $NPM, Base: $BASE → New: $NEW"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Run package tests (scoped)
        run: bun run --filter @oppulence/infinite-canvas test

      - name: Typecheck + import-boundary guard
        run: bun run lint && bun run typecheck

      - name: Publish to npm (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add packages/infinite-canvas/package.json
          VERSION=$(node -p "require('./packages/infinite-canvas/package.json').version")
          git commit -m "chore: bump @oppulence/infinite-canvas to v${VERSION}" || echo "No changes to commit"
          git push || echo "Nothing to push"

  publish-extracted-packages:
    name: Publish extracted packages
    runs-on: ubuntu-latest
    needs: [detect-changes, publish-infinite-canvas]
    if: |
      always() &&
      (needs.publish-infinite-canvas.result == 'success' || needs.publish-infinite-canvas.result == 'skipped') &&
      (
        github.event_name == 'release' ||
        github.event.inputs.package == 'core' ||
        github.event.inputs.package == 'desktop-client' ||
        github.event.inputs.package == 'e-invoicing' ||
        github.event.inputs.package == 'events' ||
        github.event.inputs.package == 'import' ||
        github.event.inputs.package == 'integrations' ||
        github.event.inputs.package == 'extracted' ||
        github.event.inputs.package == 'all' ||
        (
          github.event_name == 'push' &&
          (
            needs.detect-changes.outputs.core == 'true' ||
            needs.detect-changes.outputs.desktop_client == 'true' ||
            needs.detect-changes.outputs.e_invoicing == 'true' ||
            needs.detect-changes.outputs.events == 'true' ||
            needs.detect-changes.outputs.import == 'true' ||
            needs.detect-changes.outputs.integrations == 'true'
          )
        )
      )
    permissions:
      contents: read
      id-token: write
    env:
      CORE_CHANGED: ${{ needs.detect-changes.outputs.core }}
      DESKTOP_CLIENT_CHANGED: ${{ needs.detect-changes.outputs.desktop_client }}
      E_INVOICING_CHANGED: ${{ needs.detect-changes.outputs.e_invoicing }}
      EVENTS_CHANGED: ${{ needs.detect-changes.outputs.events }}
      IMPORT_CHANGED: ${{ needs.detect-changes.outputs.import }}
      INTEGRATIONS_CHANGED: ${{ needs.detect-changes.outputs.integrations }}
      REQUESTED_PACKAGE: ${{ github.event.inputs.package }}
      PUBLISH_ALL: ${{ github.event_name == 'release' || github.event.inputs.package == 'extracted' || github.event.inputs.package == 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          should_publish() {
            local package_dir="$1"
            local changed_flag="$2"

            [[ "$PUBLISH_ALL" == "true" ]] ||
              [[ "$REQUESTED_PACKAGE" == "$package_dir" ]] ||
              [[ "$changed_flag" == "true" ]]
          }

          # Packages that changed on this push but had nothing to publish,
          # because their version was already on the registry. That is a
          # forgotten bump, and reporting success for it is how a merge ships
          # nothing while every check stays green.
          unbumped=()

          publish_package() {
            local package_dir="$1"
            local changed_flag="$2"

            if ! should_publish "$package_dir" "$changed_flag"; then
              return
            fi

            local package_path="./packages/$package_dir"
            local package_name
            local package_version
            package_name=$(node -p "require('$package_path/package.json').name")
            package_version=$(node -p "require('$package_path/package.json').version")

            bun run --filter "$package_name" lint
            bun run --filter "$package_name" typecheck
            bun run --filter "$package_name" build
            if node -e "process.exit(require('$package_path/package.json').scripts?.test ? 0 : 1)"; then
              bun run --filter "$package_name" test
            fi

            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              # Idempotent when a release or an explicit request republishes
              # everything: most of those packages will not have moved. A
              # mistake when this push is here *because* the package changed.
              if [[ "$PUBLISH_ALL" != "true" &&
                    "$REQUESTED_PACKAGE" != "$package_dir" &&
                    "$changed_flag" == "true" ]]; then
                unbumped+=("$package_name@$package_version")
                echo "::error title=Version not bumped::$package_name changed on this push but $package_version is already published. Bump the version in packages/$package_dir/package.json."
                return
              fi
              echo "$package_name@$package_version is already published; skipping."
              return
            fi

            npm publish "$package_path" --access public --provenance
          }

          publish_package core "$CORE_CHANGED"
          publish_package desktop-client "$DESKTOP_CLIENT_CHANGED"
          publish_package e-invoicing "$E_INVOICING_CHANGED"
          publish_package events "$EVENTS_CHANGED"
          publish_package import "$IMPORT_CHANGED"
          publish_package integrations "$INTEGRATIONS_CHANGED"

          if (( ${#unbumped[@]} > 0 )); then
            echo "::error title=Nothing published::${#unbumped[@]} package(s) changed on this push and published nothing: ${unbumped[*]}"
            exit 1
          fi
